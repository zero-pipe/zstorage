# ZMS 本地/测试部署示例
#   docker compose -f deploy/docker-compose.yml up -d
services:
  zms:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        # 需要 WebRTC / SRT 时打开（SRT 依赖 libsrt）
        ZMS_ENABLE_WEBRTC: "OFF"
        ZMS_ENABLE_SRT: "OFF"
    image: zms:latest
    container_name: zms
    restart: unless-stopped
    ports:
      - "1935:1935"   # RTMP
      - "8080:8080"   # HTTP API / FLV / HLS / WebRTC 信令
      - "8554:8554"   # RTSP
      # WebRTC 媒体端口段（与 conf 中 [webrtc] 一致）
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./conf:/etc/zms:ro
      - ./record:/var/lib/zms/record
      - ./logs:/var/log/zms
    ulimits:
      nofile:
        soft: 524288
        hard: 524288
    healthcheck:
      # /index/api/system/health 不鉴权，适合做容器健康检查
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080; echo -e 'GET /index/api/system/health HTTP/1.0\\r\\n\\r\\n' >&3; head -n1 <&3 | grep -q 200"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
