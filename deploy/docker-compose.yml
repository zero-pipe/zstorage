# ZCS 本地/测试部署示例
#   docker compose -f deploy/docker-compose.yml up -d
services:
  zcs:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: zcs:latest
    container_name: zcs
    restart: unless-stopped
    ports:
      - "2035:2035"   # RTMP（拉流接入）
      - "8180:8180"   # HTTP WebAPI
      - "8654:8654"   # RTSP（回放）
    volumes:
      - ../conf:/etc/zcs:ro
      - ../www/zstorage:/var/lib/zcs/storage
      - ./logs:/var/log/zcs
    ulimits:
      nofile:
        soft: 524288
        hard: 524288
    healthcheck:
      # /index/api/system/health 不鉴权，适合做容器健康检查
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8180; echo -e 'GET /index/api/system/health HTTP/1.0\\r\\n\\r\\n' >&3; head -n1 <&3 | grep -q 200"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
